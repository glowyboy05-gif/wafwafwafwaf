name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🔧 Install dependencies
      run: npm install

    - name: 🏗️ Build Next.js app
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      run: npm run build

    - name: 🔍 Verify out directory
      run: |
        echo "Checking out directory..."
        ls -la out/ || echo "out directory does not exist!"
        ls -la out/index.html || echo "index.html does not exist!"

    - name: 📱 Add Android platform
      run: npx cap add android

    - name: 🔄 Sync Capacitor
      run: npx cap sync android

    - name: 🛠️ Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: q-control-android
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: 🎉 Build Complete
      run: echo "✅ APK built successfully! Download from Artifacts."
